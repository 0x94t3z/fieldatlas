[package]
name = "fieldatlas-leviathan"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leviathan-index = { path = "../../third_party/leviathan", default-features = false }
jni = "0.21.1"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
