<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Field Atlas social preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #f5f2e9; color: #203b30; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  main { position: relative; height: 100%; padding: 52px 60px; border-top: 8px solid #174d3b; }
  header { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; letter-spacing: -1px; }
  header img { width: 48px; height: 48px; }
  h1 { position: relative; z-index: 1; margin: 38px 0 24px; font: 400 84px/1.03 Georgia, 'Times New Roman', serif; letter-spacing: -4px; }
  h1 em { color: #174d3b; }
  p { margin: 0; color: #59665c; font-size: 24px; }
  footer { position: absolute; bottom: 44px; left: 60px; right: 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #d3d8cb; padding-top: 22px; font-size: 18px; color: #59665c; }
  .art { position: absolute; width: 400px; height: 438px; right: 66px; top: 70px; transform: rotate(-3deg); border: 1px solid #c5cdbb; border-radius: 5px; overflow: hidden; }
  .art img { display: block; width: 100%; height: 100%; }
</style>
<main>
  <header><img src="../assets/compass.svg" alt="">Field Atlas</header>
  <h1>Knowledge,<br>wherever<br><em>you go.</em></h1>
  <p>Offline research for Android.</p>
  <div class="art"><img src="../assets/atlas.svg" alt=""></div>
  <footer><span>getfieldatlas.com</span><span>Works offline after setup</span></footer>
</main>
</html>
