name: Verify public knowledge downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    if: github.repository == '0x94t3z/fieldatlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.catalog.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the in-app download catalog
        id: catalog
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          packs = json.load(open('app/src/main/assets/knowledge/catalog.json'))['packs']
          rows = [dict(id=p['id'], url=p['url'], bytes=p['bytes'], sha256=p['sha256']) for p in packs]
          print('packs=' + json.dumps(rows))
          PY

  verify:
    needs: list
    runs-on: ubuntu-latest
    # The Encyclopedia alone is a 10.6 GB download.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pack: ${{ fromJSON(needs.list.outputs.packs) }}
    env:
      ARTIFACT: ${{ toJSON(matrix.pack) }}
    steps:
      - name: Download without authentication and check every byte
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          class HTTPSOnlyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != 'https':
                      raise RuntimeError('Refusing a non-HTTPS download redirect')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          artifact = json.loads(os.environ['ARTIFACT'])
          if urllib.parse.urlsplit(artifact['url']).scheme != 'https':
              raise RuntimeError('Catalog download is not HTTPS')
          request = urllib.request.Request(artifact['url'], headers={'User-Agent': 'FieldAtlas-public-data-verification'})
          opener = urllib.request.build_opener(HTTPSOnlyRedirect())
          digest = hashlib.sha256()
          count = 0
          # No token, authorization header or write anywhere: the same anonymous download the app makes.
          with opener.open(request, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError('Public download did not return HTTP 200')
              while block := response.read(4 * 1024 * 1024):
                  count += len(block)
                  if count > artifact['bytes']:
                      raise RuntimeError('Download exceeds pinned byte count')
                  digest.update(block)
          if count != artifact['bytes'] or digest.hexdigest() != artifact['sha256']:
              raise RuntimeError('Public download size/SHA-256 differs from catalog pin')
          print('Public full download verified:', artifact['id'], count, digest.hexdigest())
          PY
